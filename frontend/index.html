<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <meta
        name="description"
        content="BSP CART - Modern Multi Vendor E-Commerce Platform"
    />

    <meta
        name="keywords"
        content="BSP CART, Ecommerce, Shopping, React, Spring Boot, Marketplace"
    />

    <meta
        name="author"
        content="BSP CART Team"
    />

    <meta
        name="theme-color"
        content="#202a44"
    />

    <meta
        property="og:title"
        content="BSP CART"
    />

    <meta
        property="og:description"
        content="Online Shopping Platform"
    />

    <meta
        property="og:type"
        content="website"
    />

    <meta
        property="og:image"
        content="/logo.png"
    />

    <meta
        property="og:url"
        content="http://localhost:5173"
    />

    <title>BSP CART | Multi Vendor Shopping Platform</title>

    <link
        rel="icon"
        href="/favicon.svg"
        type="image/svg+xml"
    />

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&display=swap"
        rel="stylesheet"
    />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
        }

        html,
        body{
            width:100%;
            height:100%;
            background:#faf6ef;
        }

        #root{
            width:100%;
            min-height:100vh;
        }

        #loading-screen{
            position:fixed;
            inset:0;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            background:#faf6ef;
            z-index:99999;
        }

        .spinner{
            width:70px;
            height:70px;
            border-radius:50%;
            border:6px solid #ece6d9;
            border-top-color:#d9a441;
            animation:spin 1s linear infinite;
        }

        @keyframes spin{

            from{
                transform:rotate(0deg);
            }

            to{
                transform:rotate(360deg);
            }

        }

        .loading-text{

            margin-top:20px;
            font-size:24px;
            font-weight:700;
            color:#202a44;
            font-family:'Fraunces',Georgia,serif;
            letter-spacing:.01em;

        }

    </style>

</head>

<body>

    <noscript>

        <div
            style="
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-size:28px;
            color:rgb(0, 132, 255);
            font-weight:bold;"
        >

            Please enable JavaScript to run BSP CART.

        </div>

    </noscript>

    <div id="loading-screen">

        <div class="spinner"></div>

        <div class="loading-text">

            BSP CART Loading...

        </div>

    </div>

    <div id="root"></div>

    <script>

        const hideLoader=()=>{

            const loader=document.getElementById("loading-screen");

            if(loader){

                loader.style.display="none";

            }

        };

        window.addEventListener("load",hideLoader);

        setTimeout(hideLoader,2500);

    </script>

    <script
        type="module"
        src="/src/main.jsx"
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
