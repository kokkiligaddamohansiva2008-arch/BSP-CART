# Server Configuration
server.port=${PORT:8080}

# MySQL Database Configuration
# createDatabaseIfNotExist creates the bsp_cart database on first start.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bsp_cart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
upload.path=${UPLOAD_PATH:uploads/}

# JWT Authentication Configuration
# The default below is for local development only (must be 32+ characters).
# Set the JWT_SECRET environment variable in production.
jwt.secret=${JWT_SECRET:bsp-cart-local-dev-secret-change-me-in-production-0123456789}
jwt.expiration=86400000

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# Sample Admin Credentials (created on first start - change the password!)
app.admin.email=${ADMIN_EMAIL:admin@bspcart.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
