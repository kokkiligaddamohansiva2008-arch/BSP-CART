
# Server Configuration
server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bsp_cart}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
upload.path=${UPLOAD_PATH:uploads/}

# JWT Authentication Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Sample Admin Credentials
app.admin.email=${ADMIN_EMAIL:admin@bspcart.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
