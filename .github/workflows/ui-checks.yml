name: BSP CART page and build checks

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ui-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-build:
    name: Verify routes, overlays and production compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Validate the product-image ZIP importer
        run: python3 -m py_compile frontend/scripts/import_product_image_archive.py
      - name: Check page routes, centered popups and sidebar layout
        run: npm run test:pages
        working-directory: frontend
      - name: Build all pages
        run: npm run build
        working-directory: frontend
