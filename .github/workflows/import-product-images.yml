name: Import owner-supplied catalogue images

on:
  push:
    branches: [main]
    paths:
      - "frontend/image-import/*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Extract and validate product photos
        run: python3 frontend/scripts/import_product_image_archive.py
      - name: Commit imported photos and mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend/public/images/products frontend/src/data/uploadedProductImages.js frontend/src/data/localImageInventory.js frontend/image-import
          if ! git diff --cached --quiet; then
            git commit -m "Import owner-provided BSP CART product JPG images"
            git push origin main
          fi
